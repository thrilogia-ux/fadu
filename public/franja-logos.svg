<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Logos institucionales UBA, FADU, Diseño, SpICC y DIS">
  <style>
    .brand { font-family: Arial, Helvetica, sans-serif; fill: #ffffff; }
    .title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .title-light { font-size: 20px; font-weight: 400; }
    .title-dis { font-size: 34px; font-weight: 800; letter-spacing: -0.04em; }
    .sub { font-size: 7px; font-weight: 400; letter-spacing: 0.01em; }
    @media (max-width: 700px) {
      .title { font-size: 16px; }
      .title-light { font-size: 16px; }
      .title-dis { font-size: 26px; }
      .sub { font-size: 5.5px; }
    }
  </style>

  <g class="brand">
    <!-- UBA -->
    <g transform="translate(28, 22)">
      <text class="title">.UBA</text>
      <text class="sub" x="0" y="16">Universidad de Buenos Aires</text>
    </g>

    <!-- FADU -->
    <g transform="translate(228, 22)">
      <text class="title">.UBA</text>
      <text class="title-light" x="52" y="0">fadu</text>
      <text class="sub" x="0" y="16">Facultad de Arquitectura, Diseño y Urbanismo</text>
    </g>

    <!-- Diseño -->
    <g transform="translate(468, 22)">
      <text class="title">.UBA</text>
      <text class="title" x="52" y="0">DISEÑO</text>
      <text class="sub" x="0" y="16">Secretaría de Fortalecimiento e Innovación Tecnológica</text>
    </g>

    <!-- SpICC -->
    <g transform="translate(728, 22)">
      <text class="title">.UBA</text>
      <text class="title" x="52" y="0">SpICC</text>
      <text class="sub" x="0" y="16">Subsecretaría de Políticas de Innovación y Calidad Comunitaria</text>
    </g>

    <!-- DIS -->
    <g transform="translate(1010, 18)">
      <text class="title-dis">DIS</text>
      <text class="sub" x="0" y="22">Diseño de Imagen y Sonido</text>
    </g>
  </g>
</svg>
